<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeekBit | Admin Panel</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/png" href="assets/img/neon-logo1.png">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        body { background-color: #050505; overflow-x: hidden; }
        
        .admin-container {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */
        .admin-sidebar {
            width: 250px;
            background: #0f0f0f;
            border-right: 1px solid #333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .admin-logo {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }

        .admin-btn {
            background: transparent;
            color: #888;
            border: 1px solid transparent;
            padding: 15px;
            text-align: left;
            cursor: pointer;
            font-family: 'Nulshock', sans-serif;
            transition: 0.3s;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-btn:hover, .admin-btn.active {
            background: rgba(0, 255, 136, 0.1);
            color: var(--accent);
            border-color: var(--accent);
        }

        /* MAIN CONTENT */
        .admin-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .section-title {
            font-family: 'Nulshock';
            color: #fff;
            margin-bottom: 30px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* TABLES & LISTS */
        .admin-card {
            background: #111;
            border: 1px solid #333;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        
        <aside class="admin-sidebar">
            <div class="admin-logo">
                <img src="assets/img/neon-logo1.png" width="60">
                <h3 style="color:#fff; margin-top:10px; font-family:'Nulshock';">ADMIN PANEL</h3>
            </div>

            <button onclick="prikaziAdminSekciju('users')" class="admin-btn active" id="btn-users">
                <i class="fas fa-users"></i> KORISNICI
            </button>
            
            <button onclick="prikaziAdminSekciju('listings')" class="admin-btn" id="btn-listings">
                <i class="fas fa-list"></i> OGLASI
            </button>
            
            <button onclick="prikaziAdminSekciju('service')" class="admin-btn" id="btn-service">
                <i class="fas fa-tools"></i> SERVIS ZAHTEVI
            </button>

            <button onclick="prikaziAdminSekciju('buyback')" class="admin-btn" id="btn-buyback">
                <i class="fas fa-hand-holding-usd"></i> INSTANT OTKUP
            </button>

            <div style="margin-top: auto;">
                <a href="index.html" class="admin-btn">
                    <i class="fas fa-arrow-left"></i> NAZAD NA SAJT
                </a>
            </div>
        </aside>

        <main class="admin-content">

            <div id="section-users" class="admin-section">
                <div class="section-title">
                    <h2>UPRAVLJANJE KORISNICIMA</h2>
                    <button onclick="ucitajKorisnike()" style="background:transparent; color:var(--accent); border:1px solid var(--accent); padding:5px 15px; cursor:pointer;">OSVEŽI</button>
                </div>
                <div id="users-list-container">
                    <p>Učitavanje korisnika...</p>
                </div>
            </div>

            <div id="section-listings" class="admin-section" style="display: none;">
                <div class="section-title">
                    <h2>SVI OGLASI</h2>
                    <button onclick="ucitajSveOglaseAdmin()" style="background:transparent; color:var(--accent); border:1px solid var(--accent); padding:5px 15px; cursor:pointer;">OSVEŽI</button>
                </div>
                <div id="listings-list-container">
                    <p>Učitavanje oglasa...</p>
                </div>
            </div>

            <div id="section-service" class="admin-section" style="display: none;">
                <div class="section-title">
                    <h2>ZAHTEVI ZA SKLAPANJE (50€)</h2>
                    <button onclick="ucitajServisneZahteve()" style="background:transparent; color:var(--accent); border:1px solid var(--accent); padding:5px 15px; cursor:pointer;">OSVEŽI</button>
                </div>
                <div id="service-requests-list" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 20px;">
                    <p style="color:#888;">Čekam podatke...</p>
                </div>
            </div>

            <div id="section-buyback" class="admin-section" style="display: none;">
                <div class="section-title">
                    <h2>ZAHTEVI ZA OTKUP (QUICK SELL)</h2>
                    <button onclick="ucitajOtkupZahteve()" style="background:transparent; color:var(--accent); border:1px solid var(--accent); padding:5px 15px; cursor:pointer;">OSVEŽI</button>
                </div>
                <div id="buyback-requests-list" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 20px;">
                    <p style="color:#888;">Učitavanje zahteva...</p>
                </div>
            </div>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="js/main.js"></script>

    <script>
        // UI Logika za tabove
        function prikaziAdminSekciju(sekcija) {
            // Sakrij sve
            document.querySelectorAll('.admin-section').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.admin-btn').forEach(el => el.classList.remove('active'));

            // Prikaži traženo
            document.getElementById('section-' + sekcija).style.display = 'block';
            document.getElementById('btn-' + sekcija).classList.add('active');

            // Pozovi funkciju iz main.js za učitavanje podataka
            if(sekcija === 'users' && window.ucitajKorisnike) window.ucitajKorisnike();
            if(sekcija === 'listings' && window.ucitajSveOglaseAdmin) window.ucitajSveOglaseAdmin();
            if(sekcija === 'service' && window.ucitajServisneZahteve) window.ucitajServisneZahteve();
            if(sekcija === 'buyback' && window.ucitajOtkupZahteve) window.ucitajOtkupZahteve();
        }

        async function checkAdminAccess() {
            const { data: { user } } = await sb.auth.getUser();
            const myEmail = "geekbit10@gmail.com"; 

            if (!user || user.email !== myEmail) {
                alert("ZABRANJEN PRISTUP! Samo za admine.");
                window.location.href = 'index.html';
            } else {
                // Po defaultu otvori Users tab
                prikaziAdminSekciju('users');
            }
        }

        window.onload = checkAdminAccess;
    </script>
</body>
</html>
